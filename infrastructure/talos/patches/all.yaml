# Applied to EVERY node (control-plane + workers).
# Per-node values (hostname, static IP, install disk, certSANs) are generated
# from the topology map in infrastructure/talos/main.tf, so they're not repeated here.
#
# Networking uses Talos defaults (Flannel CNI + kube-proxy) — nothing to set.
machine:
  time:
    servers:
      - pool.ntp.org
  # NOTE: kubelet server-certificate rotation (rotate-server-certificates) is
  # intentionally NOT enabled. It makes every kubelet file a
  # kubernetes.io/kubelet-serving CSR, which Kubernetes never auto-approves
  # (kube-controller-manager only auto-approves kubelet *client* CSRs). With no
  # approver those CSRs stay Pending and each node console loops
  # "server certificate rotation is enabled but the CSR is not approved".
  # Re-enable ONLY alongside an approver (e.g. kubelet-serving-cert-approver via
  # Flux under gitops/infrastructure) once something (metrics-server /
  # kube-prometheus-stack) actually needs signed kubelet serving certs.
  features:
    rbac: true
    kubePrism:
      enabled: true
      port: 7445
