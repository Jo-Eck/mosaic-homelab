apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.1.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Talos binds these control-plane components to localhost / behind its own
    # auth, so their default ServiceMonitors just show as "down". Disable for a
    # clean first rollout; wire real endpoints later if you want CP metrics.
    kubeControllerManager: { enabled: false }
    kubeScheduler: { enabled: false }
    kubeEtcd: { enabled: false }
    kubeProxy: { enabled: false }

    prometheus:
      prometheusSpec:
        retention: 15d
        # Discover ServiceMonitors/PodMonitors/Rules cluster-wide, not just the
        # chart's own — so app metrics get picked up without extra wiring.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi

    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi

    grafana:
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 5Gi
      # Tailnet-only exposure via the Tailscale operator -> https://grafana.<tailnet>.ts.net
      ingress:
        enabled: true
        ingressClassName: tailscale
        hosts: ["grafana"]
        tls:
          - hosts: ["grafana"]
      # TODO: replace the chart default (admin / prom-operator) with a real
      # password, e.g. grafana.admin.existingSecret pointing at a SOPS secret.
      # It's tailnet-only in the meantime.
