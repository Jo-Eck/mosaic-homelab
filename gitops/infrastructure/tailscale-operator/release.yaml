apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: "1.98.9"
      sourceRef:
        kind: HelmRepository
        name: tailscale
  install:
    createNamespace: false # namespace.yaml owns the PSA labels
  # Credentials come from the pre-created `operator-oauth` Secret (see
  # oauth-secret.sops.yaml.example); chart defaults are otherwise fine.
  # To also reach the Kubernetes API over the tailnet, set
  #   values.apiServerProxyConfig.mode: "true"
  values: {}
