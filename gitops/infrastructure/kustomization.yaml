apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Platform add-ons go here (e.g. MetalLB for LAN LoadBalancer IPs, cert-manager,
# kube-prometheus-stack). Reconciled by the "infrastructure" Flux Kustomization
# with wait: true, so apps only start once these are Ready.
resources:
  - longhorn # replicated block storage; the cluster-default StorageClass
  - local-path-provisioner # non-default node-local class (fast scratch)
