---
# Configure the MeatballCraft LXC (created by infrastructure/apps). Connects as
# root; bootstraps python3 first since a fresh container may not ship it. The
# server-pack source is set in inventory/group_vars/apps.yml.
#
#   ansible-playbook playbooks/minecraft.yml
- name: Deploy MeatballCraft server
  hosts: apps
  gather_facts: false
  pre_tasks:
    - name: Bootstrap python3 (before facts)
      ansible.builtin.raw: test -x /usr/bin/python3 || (apt-get update && apt-get install -y python3)
      changed_when: false
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - role: minecraft
