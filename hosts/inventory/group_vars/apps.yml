# Variables for the `apps` group (currently the MeatballCraft LXC).
#
# Run the CurseForge 0.18.1 SERVER pack the way it ships. The pack's own
# settings.cfg says: USE_CLEANROOM=false, MC_VER=1.12.2, FORGE_VER=14.23.5.2860 —
# i.e. Forge + Java 8. That matches the role defaults, so we only set the pack
# source here (loader/Java/versions come from roles/minecraft/defaults/main.yml).
#
# Why not Cleanroom + Java 25 (the "~2x faster" path)? Cleanroom patches the
# pack's mods at load time to call com.cleanroommc.hackery.ReflectionHackery.getURL,
# which only exists in Cleanroom <= 0.5.0 — but that era's installer can't
# --installServer (fixed only in 0.5.17-alpha, which removed getURL). The pack's
# own CLEANROOM_VER=0.3.0-alpha isn't even published on repo.cleanroommc.com.
# It's a dead end until MeatballCraft ships a server-installable Cleanroom build;
# to retry, set mc_loader/mc_java_version/mc_cleanroom_version back here.
mc_server_pack_url: "https://mediafilez.forgecdn.net/files/6668/808/Meatballcraft-Server-prerelease-0.18.1.zip"
mc_server_pack_local_src: ""
mc_server_pack_sha256: ""

# Other overrides (see hosts/roles/minecraft/defaults/main.yml):
# mc_heap: "8G"
# mc_view_distance: 6
