---
# Installs + configures MeatballCraft. The playbook connects as root, so there is
# no privilege escalation: install runs as root, then we chown to the service
# user. Loader mechanics (installer URL, --installServer, the cleanroom-<ver>.jar
# run jar) come from jchung01/Cleanroom-ServerStart-Scripts.

- name: Require a server-pack source
  ansible.builtin.assert:
    that: (mc_server_pack_local_src | length > 0) or (mc_server_pack_url | length > 0)
    fail_msg: Set mc_server_pack_local_src or mc_server_pack_url in group_vars/apps.yml.

# The pack's filename is the single source of truth for "which version is
# installed". We stamp it into .pack-extracted after a successful extract, then
# re-read it each run: when it differs (a URL bump in apps.yml), the pack is
# re-downloaded and re-extracted; when it matches, both are skipped. This is what
# makes a version upgrade a one-line change and keeps normal runs no-ops.
- name: Resolve the server-pack identity
  ansible.builtin.set_fact:
    mc_server_pack_id: "{{ (mc_server_pack_url if (mc_server_pack_url | length > 0) else mc_server_pack_local_src) | basename }}"

- name: Read the installed-pack marker
  ansible.builtin.slurp:
    src: "{{ mc_dir }}/.pack-extracted"
  register: _pack_marker
  failed_when: false

- name: Decide whether the pack must be (re)installed
  ansible.builtin.set_fact:
    mc_pack_changed: "{{ (_pack_marker.content | default('') | b64decode | trim) != mc_server_pack_id }}"

- name: Resolve loader jar + installer URL
  ansible.builtin.set_fact:
    mc_loader_jar: >-
      {{ ('cleanroom-' ~ mc_cleanroom_version ~ '.jar') if mc_loader == 'cleanroom'
         else ('forge-' ~ mc_mc_version ~ '-' ~ mc_forge_version ~ '.jar') }}
    mc_loader_installer_url: >-
      {{ ('https://repo.cleanroommc.com/releases/com/cleanroommc/cleanroom/' ~ mc_cleanroom_version ~ '/cleanroom-' ~ mc_cleanroom_version ~ '-installer.jar')
         if mc_loader == 'cleanroom'
         else ('https://maven.minecraftforge.net/net/minecraftforge/forge/' ~ mc_mc_version ~ '-' ~ mc_forge_version ~ '/forge-' ~ mc_mc_version ~ '-' ~ mc_forge_version ~ '-installer.jar') }}

# --- Java (Temurin via Adoptium) -----------------------------------------
- name: Install base packages
  ansible.builtin.apt:
    name: [curl, unzip, ca-certificates, gnupg, openssl, procps, tar, gzip]
    state: present
    update_cache: true

- name: Ensure apt keyring dir
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Adoptium GPG key
  ansible.builtin.get_url:
    url: https://packages.adoptium.net/artifactory/api/gpg/key/public
    dest: /etc/apt/keyrings/adoptium.asc
    mode: "0644"

- name: Add Adoptium apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/adoptium.asc] https://packages.adoptium.net/artifactory/deb {{ ansible_distribution_release }} main"
    filename: adoptium
    state: present

- name: Install Temurin {{ mc_java_version }} JDK
  ansible.builtin.apt:
    name: "temurin-{{ mc_java_version }}-jdk"
    state: present
    update_cache: true

# --- User / directories --------------------------------------------------
- name: Create minecraft group
  ansible.builtin.group:
    name: "{{ mc_group }}"
    system: true

- name: Create minecraft user
  ansible.builtin.user:
    name: "{{ mc_user }}"
    group: "{{ mc_group }}"
    system: true
    home: "{{ mc_dir }}"
    create_home: false
    shell: /usr/sbin/nologin

- name: Create server + backup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ mc_user }}"
    group: "{{ mc_group }}"
    mode: "0755"
  loop:
    - "{{ mc_dir }}"
    - "{{ mc_backups_dir }}"

- name: Create secret directory
  ansible.builtin.file:
    path: /etc/meatballcraft
    state: directory
    owner: root
    group: "{{ mc_group }}"
    mode: "0750"

# --- Server pack: one zip, from a local file (Prism/Discord) or a URL -----
- name: Stage server pack from a local file
  ansible.builtin.copy:
    src: "{{ mc_server_pack_local_src }}"
    dest: "{{ mc_dir }}/server-pack.zip"
    owner: "{{ mc_user }}"
    group: "{{ mc_group }}"
    mode: "0644"
  when:
    - mc_server_pack_local_src | length > 0
    - mc_pack_changed | bool

# force: true because the on-disk name is always server-pack.zip, so without it a
# URL bump (new contents, same dest) could 304 and strand the old pack. It only
# fires when mc_pack_changed, i.e. on first install or an actual version bump.
- name: Download server pack from a URL
  ansible.builtin.get_url:
    url: "{{ mc_server_pack_url }}"
    dest: "{{ mc_dir }}/server-pack.zip"
    checksum: "{{ mc_server_pack_checksum if (mc_server_pack_checksum | length > 0) else omit }}"
    force: true
    owner: "{{ mc_user }}"
    group: "{{ mc_group }}"
    mode: "0644"
  when:
    - mc_server_pack_local_src | length == 0
    - mc_pack_changed | bool

# The server pack wraps everything in a single top-level dir (e.g.
# "Meatballcraft-Server-prerelease-0.18.6.4/"), so extracting straight into
# mc_dir strands mods/ + config/ one level deep and the server loads only the
# loader's ~10 built-ins. The extractor (files/extract-pack.sh) strips that
# wrapper. It's a transferred script, not an inline `shell:` — the pack's
# array/${#..} bash collides with Ansible's arg splitter and Jinja templating.
#
# Re-extraction is driven by mc_pack_changed (the .pack-extracted marker vs the
# desired pack filename), not a bare sentinel: a plain `creates:` would skip the
# new pack on every upgrade. The script also replaces only the pack's own
# top-level dirs, so mods removed between versions don't linger and crash boot.

# Optional clean-slate world reset. Off by default; pass it for a one-shot wipe
# on a version bump you don't want to carry the old save into:
#   ansible-playbook playbooks/minecraft.yml -e mc_wipe_world=true
- name: Wipe the world for a clean pack install (opt-in)
  ansible.builtin.file:
    path: "{{ mc_dir }}/world"
    state: absent
  when: mc_wipe_world | bool
  notify: Restart meatballcraft

- name: Extract the server pack into the server dir
  ansible.builtin.script:
    cmd: extract-pack.sh {{ mc_dir | quote }} {{ mc_user | quote }} {{ mc_group | quote }} {{ mc_server_pack_id | quote }}
  when: mc_pack_changed | bool
  notify: Restart meatballcraft

# --- Loader install (Cleanroom/Forge --installServer, as root) -----------
- name: Download the {{ mc_loader }} installer
  ansible.builtin.get_url:
    url: "{{ mc_loader_installer_url }}"
    dest: "{{ mc_dir }}/loader-installer.jar"
    mode: "0644"

- name: Run --installServer (produces {{ mc_loader_jar }} + libraries/)
  ansible.builtin.command:
    cmd: "{{ mc_java_bin }} -jar {{ mc_dir }}/loader-installer.jar --installServer {{ mc_dir }}"
    chdir: "{{ mc_dir }}"
    creates: "{{ mc_dir }}/{{ mc_loader_jar }}"
  register: _installer
  notify: Restart meatballcraft

- name: Give the server dir to {{ mc_user }}
  ansible.builtin.file:
    path: "{{ mc_dir }}"
    owner: "{{ mc_user }}"
    group: "{{ mc_group }}"
    recurse: true
  when: _installer is changed

# --- RCON (localhost only; password generated on the box) ----------------
- name: Generate RCON password once
  ansible.builtin.shell: "umask 077 && openssl rand -hex 24 > /etc/meatballcraft/rcon.pass"
  args:
    creates: /etc/meatballcraft/rcon.pass

- name: Read RCON password
  ansible.builtin.slurp:
    src: /etc/meatballcraft/rcon.pass
  register: _rcon_pass

- name: Register RCON password
  ansible.builtin.set_fact:
    mc_rcon_password: "{{ _rcon_pass.content | b64decode | trim }}"

- name: Write RCON env (systemd ExecStop + helpers)
  ansible.builtin.copy:
    dest: /etc/meatballcraft/rcon.env
    content: "RCON_PASSWORD={{ mc_rcon_password }}\n"
    owner: root
    group: "{{ mc_group }}"
    mode: "0640"

- name: Install rcon-cli (gorcon)
  ansible.builtin.unarchive:
    src: "https://github.com/gorcon/rcon-cli/releases/download/v{{ mc_rcon_cli_version }}/rcon-{{ mc_rcon_cli_version }}-amd64_linux.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ["--strip-components=1", "--wildcards", "*/rcon"]
    creates: /usr/local/bin/rcon

# --- Config + service ----------------------------------------------------
- name: Template config files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ mc_user }}"
    group: "{{ mc_group }}"
    mode: "0644"
  loop:
    - { src: eula.txt.j2, dest: "{{ mc_dir }}/eula.txt" }
    - { src: server.properties.j2, dest: "{{ mc_dir }}/server.properties" }
  notify: Restart meatballcraft

- name: Install mc-console helper
  ansible.builtin.template:
    src: mc-console.sh.j2
    dest: /usr/local/bin/mc-console
    mode: "0755"

- name: Install systemd unit
  ansible.builtin.template:
    src: meatballcraft.service.j2
    dest: /etc/systemd/system/meatballcraft.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart meatballcraft

- name: Enable + start meatballcraft
  ansible.builtin.systemd:
    name: meatballcraft
    enabled: true
    state: started
    daemon_reload: true

# --- Daily world backup --------------------------------------------------
- name: Install backup script + units
  when: mc_backup_enabled
  block:
    - name: Backup script
      ansible.builtin.template:
        src: mc-backup.sh.j2
        dest: /usr/local/bin/mc-backup
        mode: "0755"
    - name: Backup service
      ansible.builtin.copy:
        dest: /etc/systemd/system/meatballcraft-backup.service
        mode: "0644"
        content: |
          [Unit]
          Description=MeatballCraft world backup
          [Service]
          Type=oneshot
          User={{ mc_user }}
          Group={{ mc_group }}
          ExecStart=/usr/local/bin/mc-backup
    - name: Backup timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/meatballcraft-backup.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Daily MeatballCraft world backup
          [Timer]
          OnCalendar=*-*-* {{ '%02d' | format(mc_backup_hour) }}:00:00
          Persistent=true
          [Install]
          WantedBy=timers.target
    - name: Enable backup timer
      ansible.builtin.systemd:
        name: meatballcraft-backup.timer
        enabled: true
        state: started
        daemon_reload: true
