# MeatballCraft (MC 1.12.2) under systemd in the infrastructure/apps LXC.
# Defaults = classic Forge + Java 8 (simplest; ships with the server pack).
# Switch to Cleanroom + modern Java (mc_loader/mc_java_version) for ~2x faster
# loads — same mods, same MC version, so it keeps the world. The live 0.18.6.4
# deployment sets those overrides in group_vars/apps.yml.

# --- Identity / paths ---
mc_user: minecraft
mc_group: minecraft
mc_dir: /opt/meatballcraft
mc_backups_dir: /opt/meatballcraft-backups

# --- Versions ---
mc_mc_version: "1.12.2"
mc_loader: forge # forge (Java 8) | cleanroom (Java 21+)
mc_forge_version: "14.23.5.2860"
# Cleanroom's installer only supports server installs from 0.5.17-alpha up.
mc_cleanroom_version: "0.5.17-alpha"
mc_java_version: 8 # Temurin/Adoptium; 8 for Forge, 21+ for Cleanroom
# Pin the exact Temurin (Adoptium's Debian layout) rather than /usr/bin/java, so
# a second JDK on the box can't win the update-alternatives race. amd64-only,
# which matches the LXC.
mc_java_bin: "/usr/lib/jvm/temurin-{{ mc_java_version }}-jdk-amd64/bin/java"
mc_rcon_cli_version: "0.10.3"

# --- Memory / JVM ---
mc_heap: "8G" # Xms=Xmx, pinned. Legion can go 10G (bump the container to ~15G).
mc_gc: zgc    # Cleanroom/modern Java only: zgc | g1
# The unit picks args by Java version: <=8 -> _java8, else _zgc/_g1 by mc_gc.
# (jchung01 ServerStart README; Java 8 set via brucethemoose's benchmarks.)
mc_java_args_java8: >-
  -server -XX:+UnlockExperimentalVMOptions -XX:+UnlockDiagnosticVMOptions
  -XX:+AlwaysActAsServerClassMachine -XX:+DisableExplicitGC -XX:+AlwaysPreTouch
  -XX:+AggressiveOpts -XX:+UseFastAccessorMethods -XX:MaxInlineLevel=15
  -XX:MaxVectorSize=32 -XX:+UseCompressedOops -XX:ThreadPriorityPolicy=1
  -XX:+UseDynamicNumberOfGCThreads -XX:NmethodSweepActivity=1
  -XX:ReservedCodeCacheSize=350M -XX:-DontCompileHugeMethods
  -XX:MaxNodeLimit=240000 -XX:NodeLimitFudgeFactor=8000 -XX:+UseFPUForSpilling
  -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:G1NewSizePercent=28
  -XX:G1HeapRegionSize=16M -XX:G1ReservePercent=20 -XX:G1MixedGCCountTarget=3
  -XX:InitiatingHeapOccupancyPercent=10 -XX:G1MixedGCLiveThresholdPercent=90
  -XX:G1RSetUpdatingPauseTimePercent=0 -XX:SurvivorRatio=32 -XX:MaxTenuringThreshold=1
  -XX:G1SATBBufferEnqueueingThresholdPercent=30
  -XX:G1ConcRefinementServiceIntervalMillis=150 -XX:G1ConcRSHotCardLimit=16
  -Dfml.readTimeout=90 -Dfml.queryResult=confirm
# Java 25 + Cleanroom: ZGC + Compact Object Headers (JEP 450; needs the unlock
# flag since COH is experimental in 25). Generational ZGC is default in 25.
mc_java_args_zgc: >-
  -XX:+UnlockExperimentalVMOptions -XX:+UseCompactObjectHeaders
  -XX:+AlwaysPreTouch -XX:+UseStringDeduplication -XX:+UseZGC
  -Dfml.readTimeout=90 -Dfml.queryResult=confirm
mc_java_args_g1: >-
  -XX:+UnlockExperimentalVMOptions -XX:+UseCompactObjectHeaders
  -XX:+AlwaysPreTouch -XX:+UseStringDeduplication -XX:+UseG1GC
  -XX:G1HeapRegionSize=8M -XX:G1NewSizePercent=28
  -Dfml.readTimeout=90 -Dfml.queryResult=confirm

# --- Server pack (set the source in group_vars/apps.yml) ---
mc_server_pack_local_src: "" # a zip on the Ansible controller (Prism/Discord), or...
mc_server_pack_url: ""       # ...a direct URL
# Optional integrity check, passed straight to get_url as "<algo>:<hash>".
# CurseForge publishes an MD5 per file, so "md5:<hash>" is the natural choice
# (also accepts sha256:, sha1:, ...). Empty = no verification.
mc_server_pack_checksum: ""
# One-shot: wipe {{ mc_dir }}/world before extracting, for a clean save on a
# version bump. Off by default; pass `-e mc_wipe_world=true` when you want it.
mc_wipe_world: false

# --- server.properties ---
mc_motd: "MOSAIC \u2014 MeatballCraft"
mc_world_type: BIOMESOP # MeatballCraft overworld (needs Biomes O' Plenty, which it ships)
mc_difficulty: normal
mc_view_distance: 6
mc_max_players: 8
mc_online_mode: true
mc_max_tick_time: 90000 # raise the watchdog for heavy worldgen; -1 disables it
mc_extra_server_properties: {}

# --- RCON (localhost-only; password generated on the box) ---
mc_rcon_port: 25575

# --- systemd restart / crash-loop guard ---
mc_restart_sec: 15
mc_start_limit_interval_sec: 600
mc_start_limit_burst: 5
mc_stop_timeout_sec: 180

# --- Backups (local; point mc_backups_dir off-box for real DR) ---
mc_backup_enabled: true
mc_backup_keep: 7
mc_backup_hour: 5
