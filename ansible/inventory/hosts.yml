# Hosts are addressed by Tailscale MagicDNS — nothing here is reachable over
# the public internet (DS-Lite). Tailnet: <tailnet>.ts.net
# Login user is `jon` everywhere; the sudo password comes from your password
# manager at runtime via `ansible-playbook -K`.
all:
  vars:
    ansible_user: jon
    ansible_python_interpreter: /usr/bin/python3
  children:
    pve:
      hosts:
        topton:
          ansible_host: topton.<tailnet>.ts.net
        legion:
          ansible_host: legion.<tailnet>.ts.net
    management:
      hosts:
        raspi:
          ansible_host: raspi.<tailnet>.ts.net
