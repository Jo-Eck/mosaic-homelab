name: apply

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/proxmox/**"
      - "infrastructure/talos/**"
      - "infrastructure/flux/**"

# Never run two applies at once (protects state + the cluster).
concurrency:
  group: mosaic-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  proxmox:
    runs-on: [self-hosted, linux, ARM64, mosaic]
    # Gate applies behind a GitHub Environment reviewer until you trust the flow.
    environment: production
    defaults:
      run:
        working-directory: infrastructure/proxmox
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: tofu init -input=false
      - run: tofu apply -input=false -auto-approve

  talos:
    needs: proxmox
    runs-on: [self-hosted, linux, ARM64, mosaic]
    environment: production
    defaults:
      run:
        working-directory: infrastructure/talos
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: tofu init -input=false
      - run: tofu apply -input=false -auto-approve

  # Bootstrap Flux so a from-scratch cluster wires itself up to GitOps with no
  # manual `flux bootstrap`. Idempotent (no-op once in place). Needs a repo-admin
  # PAT to register Flux's deploy key; B2 + the infra age key (to decrypt the
  # cluster age key into flux-system/sops-age) come from the runner's systemd
  # EnvironmentFile.
  flux:
    needs: talos
    runs-on: [self-hosted, linux, ARM64, mosaic]
    environment: production
    defaults:
      run:
        working-directory: infrastructure/flux
    env:
      TF_VAR_github_token: ${{ secrets.FLUX_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: tofu init -input=false
      - run: tofu apply -input=false -auto-approve

  # Flux (bootstrapped above) then reconciles the Kubernetes app layer from
  # gitops/clusters/mosaic — merging changes under gitops/** is enough.
