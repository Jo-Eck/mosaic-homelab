name: apps

# App containers (LXCs) are safe to configure automatically — unlike the PVE
# hosts, they can't affect cluster quorum. Tofu creates/updates the container,
# then Ansible configures it. Host-level Ansible (pve-hosts.yml) stays manual.
on:
  workflow_dispatch: {} # let you re-run after fixes that don't touch the paths below
  push:
    branches: [main]
    paths:
      - "infrastructure/apps/**"
      - "hosts/roles/minecraft/**"
      - "hosts/playbooks/minecraft.yml"
      - "hosts/inventory/group_vars/apps.yml"

# Shared with apply.yml so no two applies hit Proxmox/state at once.
concurrency:
  group: mosaic-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tofu:
    runs-on: [self-hosted, linux, ARM64, mosaic]
    environment: production
    defaults:
      run:
        working-directory: infrastructure/apps
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: tofu init -input=false
      - run: tofu apply -input=false -auto-approve

  configure:
    needs: tofu
    runs-on: [self-hosted, linux, ARM64, mosaic]
    environment: production
    defaults:
      run:
        working-directory: hosts
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Set up Ansible
        # The target LXC is Debian 13 (Python 3.13), so we need a modern
        # ansible-core whose bundled `six` can provide six.moves on 3.13 — the
        # apt ansible 2.10 on the Pi can't ("No module named
        # 'ansible.module_utils.six.moves'"). ansible-core 2.18 needs controller
        # Python >= 3.11 but the Pi ships 3.9, so run under mise's Python
        # (pinned in .mise.toml), never /usr/bin/ansible.
        run: |
          pip install --upgrade 'ansible-core~=2.18.0'
          # pip drops ansible* into mise's python bin, but mise only shims the
          # tools it manages — so without this, PATH still finds the apt ansible
          # 2.10 at /usr/bin. Put mise's python bin first (persists to the next
          # step via GITHUB_PATH) so ansible-playbook runs under Python 3.12.
          echo "$(mise where python)/bin" >> "$GITHUB_PATH"
          export PATH="$(mise where python)/bin:$PATH"
          command -v ansible-playbook
          ansible --version
          # Fail loudly if PATH still resolves to the old apt ansible (no "[core").
          ansible --version | grep -q '\[core ' || { echo "::error::apt ansible on PATH, not mise's ansible-core"; exit 1; }
          # --clear-response-cache/--no-cache: this runner is persistent, and
          # ansible-galaxy's response cache (~/.ansible/galaxy_cache/api.json) can
          # pin a stale Galaxy API version — e.g. seeded by the old apt ansible
          # 2.10 above — so later runs negotiate the *removed* v2 API and die with
          # "getting available versions of collection community.general: 'results'"
          # ('results' is v2's pagination key). A clean client negotiates v3 fine;
          # clear the cache and don't reuse it so every run re-negotiates fresh.
          ansible-galaxy collection install -r requirements.yml --clear-response-cache --no-cache
      - name: Configure the app LXCs
        # MOSAIC_RUNNER_SSH_KEY (deploy key path) comes from the runner's systemd
        # EnvironmentFile; its public key is seeded into the container by
        # infrastructure/apps (var runner_ssh_public_key).
        run: ANSIBLE_PRIVATE_KEY_FILE="$MOSAIC_RUNNER_SSH_KEY" ansible-playbook playbooks/minecraft.yml
