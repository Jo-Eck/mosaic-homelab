name: apps

# App containers (LXCs) are safe to configure automatically — unlike the PVE
# hosts, they can't affect cluster quorum. Tofu creates/updates the container,
# then Ansible configures it. Host-level Ansible (pve-hosts.yml) stays manual.
on:
  push:
    branches: [main]
    paths:
      - "infrastructure/apps/**"
      - "hosts/roles/minecraft/**"
      - "hosts/playbooks/minecraft.yml"
      - "hosts/group_vars/apps.yml"

# Shared with apply.yml so no two applies hit Proxmox/state at once.
concurrency:
  group: mosaic-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tofu:
    runs-on: [self-hosted, linux, ARM64, mosaic]
    environment: production
    defaults:
      run:
        working-directory: infrastructure/apps
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: tofu init -input=false
      - run: tofu apply -input=false -auto-approve

  configure:
    needs: tofu
    runs-on: [self-hosted, linux, ARM64, mosaic]
    environment: production
    defaults:
      run:
        working-directory: hosts
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ansible
        run: |
          command -v ansible-playbook >/dev/null 2>&1 || python3 -m pip install --user --break-system-packages ansible-core
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ansible-galaxy collection install -r requirements.yml
      - name: Configure the app LXCs
        # MOSAIC_RUNNER_SSH_KEY (deploy key path) comes from the runner's systemd
        # EnvironmentFile; its public key is seeded into the container by
        # infrastructure/apps (var runner_ssh_public_key).
        run: ANSIBLE_PRIVATE_KEY_FILE="$MOSAIC_RUNNER_SSH_KEY" ansible-playbook playbooks/minecraft.yml
